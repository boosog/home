<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 320 220" width="320" height="220" xmlns="http://www.w3.org/2000/svg">
            <!-- Background Counter Wall & Shelf -->
            <rect x="10" y="145" width="300" height="8" rx="2" fill="#d1ded7" />
            <rect x="0" y="153" width="320" height="67" fill="#e8f0ec" />

            <!-- Coffee Bag / Retail Decor on Counter -->
            <g transform="translate(25, 80)">
              <rect x="0" y="20" width="32" height="45" rx="4" fill="#c2a68c" />
              <polygon points="0,20 6,0 26,0 32,20" fill="#b09276" />
              <circle cx="16" cy="42" r="7" fill="#134e35" />
              <!-- Coffee Bean shape -->
              <path d="M14 42 C14 39 18 39 18 42 C18 45 14 45 14 42 Z" fill="#ffffff" />
            </g>

            <!-- Decorative Plant -->
            <g transform="translate(265, 85)">
              <path d="M 12 35 L 2 60 L 26 60 Z" fill="#a89f91" />
              <path d="M 14 35 C 5 20, -5 10, 0 0 C 10 10, 15 20, 14 35 Z" fill="#2c8560" />
              <path d="M 14 35 C 20 15, 30 10, 32 0 C 25 12, 18 22, 14 35 Z" fill="#134e35" />
            </g>

            <!-- Restaurant POS Terminal Display -->
            <g transform="translate(100, 45)">
              <!-- Monitor Stand -->
              <rect x="42" y="90" width="20" height="20" fill="#64748b" />
              <ellipse cx="52" cy="110" rx="30" ry="6" fill="#475569" />

              <!-- Monitor Body -->
              <rect x="0" y="0" width="104" height="92" rx="8" fill="#1e293b" />
              <rect x="4" y="4" width="96" height="84" rx="6" fill="#0f172a" />
              <!-- Screen Interface -->
              <rect x="7" y="7" width="90" height="78" rx="4" fill="#ffffff" />

              <!-- Paid Confirmation Graphic on Screen -->
              <circle cx="52" cy="38" r="16" fill="#134e35" />
              <!-- Thumbs up / Checkmark icon -->
              <path d="M 44 38 L 49 43 L 60 32" stroke="#ffffff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none" />

              <rect x="20" y="60" width="64" height="14" rx="4" fill="#134e35" />
              <text x="52" y="70" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="8" font-weight="bold" fill="#ffffff" text-anchor="middle">PAID IN FULL</text>
            </g>

            <!-- Instant E-Receipt Popout -->
            <g transform="translate(205, 55)">
              <!-- Paper Receipt -->
              <path d="M 0 0 L 50 0 L 50 85 L 43 81 L 35 85 L 28 81 L 20 85 L 13 81 L 5 85 L 0 81 Z" fill="#ffffff" filter="drop-shadow(0px 4px 6px rgba(0,0,0,0.06))" />
              <!-- Receipt Header -->
              <circle cx="15" cy="15" r="5" fill="#134e35" />
              <rect x="24" y="12" width="20" height="6" rx="2" fill="#94a3b8" />
              <line x1="8" y1="28" x2="42" y2="28" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="2 2" />
              <!-- Receipt Lines -->
              <rect x="8" y="34" width="20" height="4" rx="1" fill="#64748b" />
              <rect x="34" y="34" width="8" height="4" rx="1" fill="#64748b" />
              <rect x="8" y="42" width="16" height="4" rx="1" fill="#94a3b8" />
              <rect x="34" y="42" width="8" height="4" rx="1" fill="#94a3b8" />
              <line x1="8" y1="52" x2="42" y2="52" stroke="#cbd5e1" stroke-width="1" />
              <!-- Total -->
              <rect x="8" y="58" width="14" height="5" rx="1" fill="#134e35" />
              <rect x="30" y="58" width="12" height="5" rx="1" fill="#134e35" />
            </g>
          </svg>
