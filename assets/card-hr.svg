<?xml version="1.0" encoding="UTF-8"?>
<svg viewBox="0 0 320 220" width="320" height="220" xmlns="http://www.w3.org/2000/svg">
            <!-- Background Desk Surface line -->
            <line x1="10" y1="185" x2="310" y2="185" stroke="#cbd5e1" stroke-width="2" stroke-linecap="round" />

            <!-- Green Binders (Organized HR Files on Left) -->
            <g transform="translate(25, 82)">
              <!-- Binder 1 -->
              <rect x="0" y="0" width="18" height="95" rx="3" fill="#134e35" />
              <rect x="4" y="12" width="10" height="20" rx="1" fill="#ffffff" opacity="0.9" />
              <circle cx="9" cy="65" r="3" fill="#0e3e2b" />
              <!-- Binder 2 -->
              <rect x="21" y="0" width="18" height="95" rx="3" fill="#2c8560" />
              <rect x="25" y="12" width="10" height="20" rx="1" fill="#ffffff" opacity="0.9" />
              <circle cx="30" cy="65" r="3" fill="#134e35" />
            </g>

            <!-- HR Laptop & Analytics Dashboard -->
            <g transform="translate(75, 40)">
              <!-- Laptop Screen Shell -->
              <rect x="0" y="0" width="180" height="125" rx="10" fill="#1e293b" />
              <rect x="4" y="4" width="172" height="117" rx="7" fill="#f8fafc" />
              
              <!-- Laptop Base / Keyboard Section -->
              <path d="M -20 125 L 200 125 L 210 137 C 210 140, 205 142, 195 142 L -15 142 C -25 142, -30 140, -30 137 Z" fill="#94a3b8" />
              <path d="M 75 127 L 125 127 L 122 133 L 78 133 Z" fill="#64748b" />

              <!-- Dashboard Header inside Screen -->
              <rect x="12" y="12" width="156" height="22" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
              <!-- Logo & Title -->
              <rect x="18" y="18" width="10" height="10" rx="2" fill="#134e35" />
              <text x="32" y="26" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="7" font-weight="bold" fill="#0f172a">Monthly Expense Report</text>
              <rect x="130" y="17" width="30" height="12" rx="3" fill="#134e35" />
              <text x="145" y="25" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="5" font-weight="bold" fill="#ffffff" text-anchor="middle">Export PDF</text>

              <!-- Main Bar Chart Graphic -->
              <rect x="12" y="40" width="100" height="72" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
              <text x="20" y="52" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="6" font-weight="bold" fill="#64748b">MEAL BUDGET UTILIZATION</text>
              
              <!-- Grid lines -->
              <line x1="20" y1="62" x2="102" y2="62" stroke="#f1f5f9" stroke-width="1" />
              <line x1="20" y1="78" x2="102" y2="78" stroke="#f1f5f9" stroke-width="1" />
              <line x1="20" y1="94" x2="102" y2="94" stroke="#f1f5f9" stroke-width="1" />

              <!-- Animated-style Bar chart columns -->
              <rect x="26" y="70" width="10" height="28" rx="2" fill="#94a3b8" />
              <rect x="42" y="60" width="10" height="38" rx="2" fill="#2c8560" />
              <rect x="58" y="78" width="10" height="20" rx="2" fill="#94a3b8" />
              <rect x="74" y="52" width="10" height="46" rx="2" fill="#134e35" />
              <rect x="90" y="65" width="10" height="33" rx="2" fill="#2c8560" />

              <!-- Summary Card Widget on Right of Dashboard -->
              <rect x="118" y="40" width="50" height="33" rx="4" fill="#ffffff" stroke="#e2e8f0" stroke-width="1" />
              <text x="123" y="50" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="5" font-weight="bold" fill="#94a3b8">TOTAL MEALS</text>
              <text x="123" y="64" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="10" font-weight="bold" fill="#134e35">1,284</text>

              <rect x="118" y="79" width="50" height="33" rx="4" fill="#134e35" />
              <text x="123" y="89" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="5" font-weight="bold" fill="#a3cfbb">AUTO-TOPUP</text>
              <text x="123" y="102" font-family="'Plus Jakarta Sans', system-ui, -apple-system, sans-serif" font-size="9" font-weight="bold" fill="#ffffff">Active ✓</text>
            </g>

            <!-- Small Organized Receipt Holder on Right Side -->
            <g transform="translate(270, 135)">
              <rect x="0" y="0" width="28" height="42" rx="4" fill="#e2e8f0" />
              <path d="M 6 -10 L 22 -10 L 22 25 L 6 25 Z" fill="#ffffff" stroke="#cbd5e1" stroke-width="1" />
              <line x1="9" y1="-4" x2="19" y2="-4" stroke="#134e35" stroke-width="1.5" />
              <line x1="9" y1="2" x2="17" y2="2" stroke="#94a3b8" stroke-width="1" />
              <line x1="9" y1="7" x2="15" y2="7" stroke="#94a3b8" stroke-width="1" />
            </g>
          </svg>
